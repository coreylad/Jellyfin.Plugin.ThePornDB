name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Four-part plugin version calculated by the Build workflow
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*.Plugin*'
          merge-multiple: true
          path: artifacts
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$COMMIT" \
            --jq .body > artifacts/release-notes.md
          test -s artifacts/release-notes.md
      - name: Generate Jellyfin repository manifest
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/release.py manifest \
            --version "$VERSION" \
            --repository "$REPOSITORY" \
            --archive artifacts/Jellyfin.Plugin.ThePornDB.zip \
            --changelog-file artifacts/release-notes.md \
            --output artifacts/manifest.json
          test -s artifacts/Emby.Plugins.ThePornDB.zip
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip artifacts/manifest.json --clobber
          else
            gh release create "$tag" artifacts/*.zip artifacts/manifest.json \
              --target "$COMMIT" --title "ThePornDB $VERSION" \
              --notes-file artifacts/release-notes.md --latest
          fi
